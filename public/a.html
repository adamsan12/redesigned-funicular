        function getRandomAdditionalContent() {
            const item = additionalContent[Math.floor(Math.random() * additionalContent.length)];
            const leftIcon = random(leftIcons);   // Ambil icon kiri secara random
            
            return {
                title: `📁 ${leftIcon} ${item.title}`,
                link: item.link
            };
        }

        // State
        let currentDomainIndex = 0;
        let titlesVisible = true;
        let lastResults = [];

        // DOM Elements
        const customDomainInput = document.getElementById('customDomain');
        const resultTextarea = document.getElementById('result');
        const randomCountInput = document.getElementById('randomCount');
        const showAdditionalCheck = document.getElementById('showAdditionalContent');
        const maxWordsInput = document.getElementById('maxWordsInput');
        const enableGeneratorCheck = document.getElementById('enableGenerator');
        const useLeftIconCheck = document.getElementById('useLeftIcon');
        const useRightIconCheck = document.getElementById('useRightIcon');
        const useCtaCheck = document.getElementById('useCta');
        const regeneratePreviewBtn = document.getElementById('regeneratePreviewBtn');
        const toggleTitleBtn = document.getElementById('toggleTitleButton');
        const listBtn = document.getElementById('listButton');

        function getNextDomain() {
            const domains = customDomainInput.value.split(',').map(d => d.trim()).filter(Boolean);
            if (!domains.length) return 'doodi.pages.dev';
            const domain = domains[currentDomainIndex];
            currentDomainIndex = (currentDomainIndex + 1) % domains.length;
            return domain;
        }

        function formatLink(path) {
            if (!path) return "#";
            if (path.startsWith('http')) return path;
            const cleanPath = path.startsWith('/') ? path : '/' + path;
            return `https://${getNextDomain()}${cleanPath}`;
        }

        function cleanTitle(title) {
            if (!title) return "Video Viral";
            const forbidden = ['di','ke','dari','yang','untuk','dan','atau','dengan','oleh','karena','ini','itu','bokep','memek','ngentot','ngewe','colmek','kontol','pepek','muncrat'];
            let cleaned = title;
            forbidden.forEach(w => {
                cleaned = cleaned.replace(new RegExp(`\\b${w}\\b`, 'gi'), '');
            });
            const words = cleaned.trim().split(/\s+/).filter(Boolean);
            const maxW = parseInt(maxWordsInput.value) || 3;
            return words.slice(0, maxW).join(' ');
        }

        function displayResultsWithGenerator(results) {
            let output = '';
            if (!results || results.length === 0) {
                resultTextarea.value = 'Tidak ada hasil ditemukan.';
                return;
            }

            const generatorActive = enableGeneratorCheck.checked;
            const useLeft = useLeftIconCheck.checked;
            const useRight = useRightIconCheck.checked;
            const useCta = useCtaCheck.checked;

            results.forEach((item, idx) => {
                const rawTitle = (item.title || `Video ${idx + 1}`).trim();
                const cleanedTitle = cleanTitle(rawTitle);

                let finalTitle = cleanedTitle;
                if (generatorActive) {
                    finalTitle = generateUniqueTitle(cleanedTitle, {
                        useLeftIcon: useLeft,
                        useRightIcon: useRight,
                        useCta: useCta
                    });
                } else {
                    finalTitle = `${cleanedTitle} videy dood`;
                }

                const fileCode = item.file_code || item.code;
                const mainLink = fileCode ? formatLink(`/e/${fileCode}`) : "#";

                if (titlesVisible) {
                    output += `${finalTitle}\n${mainLink}\n\n`;
                } else {
                    output += `${mainLink}\n\n`;
                }

                if (showAdditionalCheck.checked && titlesVisible) {
                    const add = getRandomAdditionalContent();
                    const additionalLink = formatLink(add.link);
                    output += `${add.title}\n${additionalLink}\n\n`;
                }
            });

            resultTextarea.value = output.trim();
            document.getElementById('modeStatus').innerText = generatorActive ? '🎨 Generator ON' : 'Normal';
        }

        // ======================= RANDOM LIST =======================
        function performRandomList() {
            const randomPage = Math.floor(Math.random() * 200) + 1;
            const url = `https://wikisd.pages.dev/api/list?page=${randomPage}`;

            resultTextarea.value = `🔄 Mengambil data dari page ${randomPage}...`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    let results = [];
                    if (data.result && Array.isArray(data.result)) {
                        results = data.result;
                    } else if (data.result && data.result.files && Array.isArray(data.result.files)) {
                        results = data.result.files;
                    } else if (data.status === 200 && Array.isArray(data.data)) {
                        results = data.data;
                    } else if (Array.isArray(data)) {
                        results = data;
                    }

                    if (results.length > 0) {
                        lastResults = results;
                        displayResultsWithGenerator(lastResults);
                    } else {
                        resultTextarea.value = '⚠️ Format data tidak sesuai atau data kosong dari API.';
                    }
                })
                .catch(err => {
                    console.error(err);
                    resultTextarea.value = '❌ Gagal mengambil data random.\nCoba lagi.';
                });
        }

            toggleTitleBtn.textContent = titlesVisible ? '👁️ Sembunyikan Title' : 'Tampilkan Title';
