name: Daily Video Fetch & Index Generation

on:
  # Trigger setiap hari jam 07:00 UTC (14:00 WIB)
  schedule:
    - cron: '0 7 * * *'
  
  # Manual trigger (Optional)
  workflow_dispatch:

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
      
      - name: 🚀 Run fetch & generate indexes
        run: |
          echo "⏱️  Starting video fetch and index generation..."
          python sedot.py
          echo "✅ Generation complete!"
      
      - name: 📊 Check if files changed
        id: changes
        run: |
          git diff --quiet public/data/ || echo "CHANGED=true" >> $GITHUB_OUTPUT
      
      - name: 📝 Setup Git config
        if: steps.changes.outputs.CHANGED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: 📤 Commit and push changes
        if: steps.changes.outputs.CHANGED == 'true'
        run: |
          git add public/data/
          git commit -m "🔄 Auto-update: Daily video fetch & index generation ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          git push origin main
      
      - name: ✅ Summary
        run: |
          echo "### ✅ Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "public/data/meta.json" ]; then
            TOTAL=$(jq '.total' public/data/meta.json)
            echo "- **Total Videos Indexed:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Shards Generated:** 256 (00.json - ff.json)" >> $GITHUB_STEP_SUMMARY
          echo "- **Output Location:** \`public/data/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pages URL:** https://videostream.pages.dev" >> $GITHUB_STEP_SUMMARY
